<section id="giveaways-tab" class="tab-pane hidden">
    <div class="bg-white rounded-2xl shadow-xl p-8 border-b-4 border-pink-500">
        <h4 class="text-3xl font-bold text-gray-900 mb-8 flex items-center gap-3">
            <i class="fa-solid fa-gift text-pink-600"></i>
            إدارة المسابقات
        </h4>

        <!-- Create Giveaway -->
        <div class="mb-8 bg-pink-50 border border-pink-200 rounded-xl p-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">اسم المسابقة:</label>
            <input id="giveaway-admin-name" type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 mb-4"
                placeholder="اكتب اسم المسابقة..." required>

            <label class="block text-gray-700 text-sm font-bold mb-2">الوصف:</label>
            <textarea id="giveaway-admin-description"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 mb-4"
                rows="3" placeholder="اكتب وصفًا مختصرًا"></textarea>

            <label class="block text-gray-700 text-sm font-bold mb-2">الموعد النهائي:</label>
            <input id="giveaway-admin-deadline" type="datetime-local"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 mb-4"
                required>

            <label class="block text-gray-700 text-sm font-bold mb-2">صورة المسابقة:</label>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <input id="giveaway-admin-image-file" type="file" accept="image/*" class="w-full sm:flex-1 min-w-0">
                <button id="giveaway-upload-btn"
                    class="w-full sm:w-auto bg-pink-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-pink-700 transition-all duration-300">
                    إضافة المسابقة
                </button>
            </div>
            <p id="giveaway-upload-status" class="mt-3 text-sm text-gray-500"></p>
        </div>

        <div>
            <h5 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-list text-pink-600"></i> المسابقات الحالية
            </h5>
            <div id="admin-giveaways-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- giveaways will be loaded here -->
            </div>
        </div>
    </div>
</section>
