<section id="sponsors-tab" class="tab-pane hidden">
    <div class="bg-white rounded-2xl shadow-xl p-8 border-b-4 border-purple-500">
        <h4 class="text-3xl font-bold text-gray-900 mb-8 flex items-center gap-3">
            <i class="fa-solid fa-handshake text-purple-600"></i>
            إدارة الرعاة
        </h4>

        <div class="mb-8 bg-purple-50 border border-purple-200 rounded-xl p-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">اسم الراعي:</label>
            <input id="sponsor-name" type="text"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 mb-4"
                placeholder="اكتب اسم الراعي..." required>

            <label class="block text-gray-700 text-sm font-bold mb-2">شعار الراعي:</label>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <input id="sponsor-image-file" type="file" accept="image/*" class="w-full sm:flex-1 min-w-0" required>
                <button id="sponsor-upload-btn"
                    class="w-full sm:w-auto bg-purple-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-purple-700 transition-all duration-300">
                    إضافة الراعي
                </button>
            </div>
            <p id="sponsor-upload-status" class="mt-3 text-sm text-gray-500"></p>
        </div>

        <div>
            <h5 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-building text-purple-600"></i> الرعاة الحاليون
            </h5>
            <div id="admin-sponsors-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- sponsors will be loaded here -->
            </div>
        </div>
    </div>
</section>
