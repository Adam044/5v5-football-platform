<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة اللاعبين - 5ع5</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/components/styles.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        :root {
            --primary-color: #10B981;
            --secondary-color: #3B82F6;
            --background-color: #f0f4f8;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .player-card {
            transition: all 0.3s ease;
            transform: translateY(0);
        }

        .player-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            transition: all 0.3s ease;
        }

        .search-input:focus {
            transform: scale(1.02);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Global Header Placeholder -->
    <div id="global-header"></div>

    <!-- Players Management Content -->
    <main class="flex-grow container mx-auto px-6 py-20 animate-fade-in">
        <div class="max-w-7xl mx-auto">
            <!-- Header Section -->
            <div class="text-center mb-12">
                <h1 class="text-5xl font-extrabold text-gray-900 mb-4">
                    إدارة <span class="text-blue-600">اللاعبين</span>
                </h1>
                <p class="text-xl text-gray-600">عرض وإدارة معلومات جميع اللاعبين المسجلين في النظام</p>
            </div>

            <!-- Search and Filter Section -->
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-8">
                <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div class="flex-1 max-w-md">
                        <div class="relative">
                            <input type="text" id="search-input"
                                placeholder="البحث عن لاعب (الاسم، الهاتف، البريد الإلكتروني...)"
                                class="search-input w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent text-right">
                            <i
                                class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <select id="gender-filter"
                            class="px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">جميع الأجناس</option>
                            <option value="male">ذكر</option>
                            <option value="female">أنثى</option>
                        </select>
                        <button onclick="refreshPlayers()"
                            class="bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 transition-all duration-300 shadow-md flex items-center gap-2">
                            <i class="fa-solid fa-refresh"></i>
                            تحديث
                        </button>
                    </div>
                </div>
            </div>

            <!-- Players Count -->
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-2xl p-6 mb-8 shadow-xl">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-2xl font-bold mb-2">إجمالي اللاعبين المسجلين</h3>
                        <p id="total-players-count" class="text-4xl font-extrabold">0</p>
                    </div>
                    <i class="fa-solid fa-users text-6xl text-blue-200"></i>
                </div>
            </div>

            <!-- Players Table -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                <div class="p-6 border-b border-gray-200">
                    <h3 class="text-2xl font-bold text-gray-900 flex items-center gap-3">
                        <i class="fa-solid fa-table text-blue-600"></i>
                        قائمة اللاعبين
                    </h3>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th
                                    class="px-6 py-4 text-right text-sm font-bold text-gray-700 uppercase tracking-wider">
                                    <i class="fa-solid fa-user ml-2"></i>الاسم
                                </th>
                                <th
                                    class="px-6 py-4 text-right text-sm font-bold text-gray-700 uppercase tracking-wider">
                                    <i class="fa-solid fa-envelope ml-2"></i>البريد الإلكتروني
                                </th>
                                <th
                                    class="px-6 py-4 text-right text-sm font-bold text-gray-700 uppercase tracking-wider">
                                    <i class="fa-solid fa-phone ml-2"></i>رقم الهاتف
                                </th>
                                <th
                                    class="px-6 py-4 text-right text-sm font-bold text-gray-700 uppercase tracking-wider">
                                    <i class="fa-solid fa-calendar ml-2"></i>تاريخ الميلاد
                                </th>
                                <th
                                    class="px-6 py-4 text-right text-sm font-bold text-gray-700 uppercase tracking-wider">
                                    <i class="fa-solid fa-venus-mars ml-2"></i>الجنس
                                </th>
                                <th
                                    class="px-6 py-4 text-right text-sm font-bold text-gray-700 uppercase tracking-wider">
                                    <i class="fa-solid fa-calendar-plus ml-2"></i>تاريخ التسجيل
                                </th>
                                <th
                                    class="px-6 py-4 text-right text-sm font-bold text-gray-700 uppercase tracking-wider">
                                    <i class="fa-solid fa-cogs ml-2"></i>الإجراءات
                                </th>
                            </tr>
                        </thead>
                        <tbody id="players-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Players will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="text-center py-12">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                    <p class="text-xl text-gray-600">جاري تحميل بيانات اللاعبين...</p>
                </div>

                <div id="empty-state" class="text-center py-12 hidden">
                    <i class="fa-solid fa-users-slash text-6xl text-gray-400 mb-4"></i>
                    <p class="text-xl text-gray-600">لا توجد بيانات لاعبين متاحة</p>
                </div>

                <!-- Load More Button -->
                <div id="load-more-container" class="p-6 text-center border-t border-gray-100 hidden">
                    <button id="load-more-btn" onclick="loadMore()" 
                        class="bg-blue-50 text-blue-600 px-8 py-3 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition-all duration-300 flex items-center gap-2 mx-auto">
                        <i class="fa-solid fa-plus"></i>
                        تحميل المزيد من اللاعبين
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Message Box -->
    <div id="message-box"
        class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 animate-fade-in">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 animate-scale-in-up border-t-4">
            <div class="p-8 text-center">
                <div id="message-box-title" class="text-2xl font-bold mb-4 flex items-center justify-center gap-3">
                </div>
                <div id="message-box-content" class="text-lg text-gray-700 mb-8 leading-relaxed"></div>
                <div id="message-box-actions" class="flex gap-4 justify-center">
                    <button onclick="hideMessageBox()"
                        class="px-8 py-3 rounded-xl font-bold transition-all duration-300 shadow-md">حسناً</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Player Details Modal -->
    <div id="player-details-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-[60] animate-fade-in">
        <div class="bg-white rounded-[2rem] shadow-3xl max-w-2xl w-full overflow-hidden animate-scale-in-up">
            <!-- Modal Header -->
            <div class="bg-blue-600 p-8 text-white flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center">
                        <i class="fa-solid fa-user-gear text-2xl"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-black">تفاصيل اللاعب</h3>
                        <p class="text-blue-100 text-sm font-bold opacity-80">عرض كافة البيانات المسجلة</p>
                    </div>
                </div>
                <button onclick="closePlayerModal()" class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center hover:bg-white/20 transition-all">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-8 max-h-[70vh] overflow-y-auto custom-scrollbar">
                <div id="player-details-content" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Dynamic content will be injected here -->
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="bg-gray-50 p-6 border-t border-gray-100 flex justify-end">
                <button onclick="closePlayerModal()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-md">
                    إغلاق النافذة
                </button>
            </div>
        </div>
    </div>

    <div id="global-footer"></div>

    <script src="/components/header.js"></script>
    <script src="/components/footer.js"></script>
    <script src="/components/loader.js"></script>
    <script>
        let allPlayers = [];
        let filteredPlayers = [];
        let displayedCount = 10;
        const INCREMENT = 10;

        // --- Admin Access Check on page load ---
        async function checkAdminAccess() {
            try {
                const meResp = await fetch('/api/me', { credentials: 'include' });
                if (!meResp.ok) {
                    showMessageBox('غير مصرح', 'يجب تسجيل الدخول أولاً.', 'error');
                    setTimeout(() => window.location.href = 'auth.html', 1500);
                    return;
                }
                const { user } = await meResp.json();
                if (!user || !user.is_admin) {
                    showMessageBox('غير مصرح', 'ليس لديك صلاحيات للوصول إلى هذه الصفحة.', 'error');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                    return;
                }
                await loadPlayers();
            } catch (e) {
                console.error('Admin access check failed:', e);
                showMessageBox('خطأ', 'حدث خطأ أثناء التحقق من الوصول.', 'error');
            }
        }

        // Load all players from the server
        async function loadPlayers() {
            const loadingState = document.getElementById('loading-state');
            const emptyState = document.getElementById('empty-state');
            const tableBody = document.getElementById('players-table-body');
            const loadMoreContainer = document.getElementById('load-more-container');

            loadingState.classList.remove('hidden');
            emptyState.classList.add('hidden');
            loadMoreContainer.classList.add('hidden');
            tableBody.innerHTML = '';
            displayedCount = INCREMENT;

            try {
                const response = await fetch('/api/admin/players', { credentials: 'include' });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                allPlayers = data.players || [];
                filteredPlayers = [...allPlayers];

                displayPlayers();
                updatePlayersCount();

            } catch (error) {
                console.error('Error loading players:', error);
                showMessageBox('خطأ', 'فشل في تحميل بيانات اللاعبين.', 'error');
                emptyState.classList.remove('hidden');
            } finally {
                loadingState.classList.add('hidden');
            }
        }

        // Display players in the table
        function displayPlayers() {
            const tableBody = document.getElementById('players-table-body');
            const emptyState = document.getElementById('empty-state');
            const loadMoreContainer = document.getElementById('load-more-container');

            if (filteredPlayers.length === 0) {
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                loadMoreContainer.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const playersToShow = filteredPlayers.slice(0, displayedCount);
            
            tableBody.innerHTML = playersToShow.map((player, index) => {
                // Format dates with English numbers
                const birthdate = player.birthdate ?
                    new Date(player.birthdate).toLocaleDateString('en-GB').replace(/\//g, '/') : 'غير محدد';
                const createdAt = player.created_at ?
                    new Date(player.created_at).toLocaleDateString('en-GB').replace(/\//g, '/') : 'غير محدد';

                const genderText = player.gender === 'male' ? 'ذكر' :
                    player.gender === 'female' ? 'أنثى' :
                        player.gender === 'ذكر' ? 'ذكر' :
                            player.gender === 'أنثى' ? 'أنثى' : 'غير محدد';

                return `
                    <tr class="player-card hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="flex-shrink-0 h-10 w-10">
                                    <div class="h-10 w-10 rounded-full bg-blue-500 flex items-center justify-center">
                                        <i class="fa-solid fa-user text-white"></i>
                                    </div>
                                </div>
                                <div class="mr-4">
                                    <div class="text-sm font-medium text-gray-900">${player.name || 'غير محدد'}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 font-medium">
                            ${player.email || '<span class="text-red-500 font-bold">غير متوفر</span>'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${player.phone_number ?
                        `<a href="https://wa.me/${player.phone_number.replace(/\\D/g, '')}" target="_blank" class="text-green-600 hover:text-green-800 font-bold hover:underline inline-flex items-center gap-2" dir="ltr">
                                    <i class="fa-brands fa-whatsapp text-lg"></i> ${player.phone_number}
                                </a>`
                        : '<span class="text-gray-500">غير محدد</span>'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${birthdate}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${player.gender === 'male' || player.gender === 'ذكر' ? 'bg-blue-100 text-blue-800' :
                        player.gender === 'female' || player.gender === 'أنثى' ? 'bg-pink-100 text-pink-800' :
                            'bg-gray-100 text-gray-800'
                    }">
                                ${genderText}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${createdAt}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <div class="flex items-center gap-3">
                                <button onclick="viewPlayerDetails(${allPlayers.findIndex(p => p.id === player.id)})" 
                                    class="bg-blue-50 text-blue-600 p-2.5 rounded-xl hover:bg-blue-600 hover:text-white transition-all duration-300 shadow-sm" 
                                    title="عرض التفاصيل">
                                    <i class="fa-solid fa-eye text-lg"></i>
                                </button>
                                <button onclick="confirmDeletePlayer(${player.id}, '${player.name}')" 
                                    class="bg-red-50 text-red-600 p-2.5 rounded-xl hover:bg-red-600 hover:text-white transition-all duration-300 shadow-sm" 
                                    title="حذف اللاعب">
                                    <i class="fa-solid fa-trash-can text-lg"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // Show/Hide load more button
            if (displayedCount < filteredPlayers.length) {
                loadMoreContainer.classList.remove('hidden');
            } else {
                loadMoreContainer.classList.add('hidden');
            }
        }

        function loadMore() {
            displayedCount += INCREMENT;
            displayPlayers();
        }

        // Update players count
        function updatePlayersCount() {
            document.getElementById('total-players-count').textContent = allPlayers.length;
        }

        // Search and filter functionality
        function filterPlayers() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const genderFilter = document.getElementById('gender-filter').value;

            filteredPlayers = allPlayers.filter(player => {
                const matchesSearch = !searchTerm ||
                    (player.name && player.name.toLowerCase().includes(searchTerm)) ||
                    (player.email && player.email.toLowerCase().includes(searchTerm)) ||
                    (player.phone_number && player.phone_number.includes(searchTerm));

                const matchesGender = !genderFilter || player.gender === genderFilter;

                return matchesSearch && matchesGender;
            });

            displayedCount = INCREMENT; // Reset pagination on filter
            displayPlayers();
        }

        // Refresh players data
        async function refreshPlayers() {
            await loadPlayers();
        }

        function viewPlayerDetails(index) {
             const player = allPlayers[index];
             if (!player) return;
             
             const content = document.getElementById('player-details-content');
             
             // Format dates in English locale (DD/MM/YYYY)
             const formatDate = (dateStr) => {
                 if (!dateStr) return 'غير محدد';
                 const d = new Date(dateStr);
                 return d.toLocaleDateString('en-GB'); // DD/MM/YYYY
             };

             const fields = [
                 { label: 'الاسم الكامل', value: player.name || 'غير محدد', icon: 'fa-user' },
                 { label: 'البريد الإلكتروني', value: player.email || 'غير متوفر', icon: 'fa-envelope' },
                 { label: 'رقم الهاتف', value: player.phone_number || 'غير محدد', icon: 'fa-phone' },
                 { label: 'تاريخ الميلاد', value: formatDate(player.birthdate), icon: 'fa-calendar' },
                 { label: 'الجنس', value: player.gender === 'male' || player.gender === 'ذكر' ? 'ذكر' : 'أنثى', icon: 'fa-venus-mars' },
                 { label: 'تاريخ الانضمام', value: formatDate(player.created_at), icon: 'fa-clock' },
                 { label: 'رقم التعريف (ID)', value: player.id, icon: 'fa-fingerprint' },
                 { label: 'الدور', value: player.role === 'admin' || player.is_admin ? 'مسؤول' : 'لاعب', icon: 'fa-shield-halved' }
             ];

            content.innerHTML = fields.map(f => `
                <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 flex items-start gap-4">
                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid ${f.icon}"></i>
                    </div>
                    <div>
                        <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">${f.label}</p>
                        <p class="text-sm font-bold text-gray-900">${f.value}</p>
                    </div>
                </div>
            `).join('');

            document.getElementById('player-details-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePlayerModal() {
            document.getElementById('player-details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        async function confirmDeletePlayer(id, name) {
            if (confirm(`هل أنت متأكد من رغبتك في حذف اللاعب "${name}"؟ لا يمكن التراجع عن هذا الإجراء.`)) {
                try {
                    const response = await fetch(`/api/admin/delete-player/${id}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    const result = await response.json();
                    
                    if (response.ok) {
                        showMessageBox('نجاح', 'تم حذف المستخدم بنجاح مع كافة بياناته', 'success');
                        loadPlayers(); // Refresh list
                    } else {
                        showMessageBox('خطأ', result.error || 'حدث خطأ أثناء الحذف', 'error');
                    }
                } catch (err) {
                    showMessageBox('خطأ', 'فشل الاتصال بالخادم', 'error');
                }
            }
        }

        // Message box functions
        function showMessageBox(title, content, type = 'info', callback = null) {
            const msgBox = document.getElementById('message-box');
            const msgTitle = document.getElementById('message-box-title');
            const msgContent = document.getElementById('message-box-content');
            const actionsContainer = document.getElementById('message-box-actions');

            let icon, color, buttonClass, buttonText;

            switch (type) {
                case 'success':
                    icon = `<i class="fa-solid fa-circle-check text-green-500 ml-2"></i>`;
                    color = 'green';
                    buttonClass = 'bg-green-600 text-white';
                    buttonText = 'رائع!';
                    break;
                case 'error':
                    icon = `<i class="fa-solid fa-circle-xmark text-red-500 ml-2"></i>`;
                    color = 'red';
                    buttonClass = 'bg-red-600 text-white';
                    buttonText = 'حسناً';
                    break;
                case 'warning':
                    icon = `<i class="fa-solid fa-triangle-exclamation text-yellow-500 ml-2"></i>`;
                    color = 'yellow';
                    buttonClass = 'bg-yellow-600 text-white';
                    buttonText = 'فهمت';
                    break;
                default:
                    icon = `<i class="fa-solid fa-circle-info text-blue-500 ml-2"></i>`;
                    color = 'blue';
                    buttonClass = 'bg-blue-600 text-white';
                    buttonText = 'حسناً';
            }

            msgTitle.innerHTML = `${icon}${title}`;
            msgContent.textContent = content;
            msgBox.querySelector('.bg-white').classList.add(`border-t-4`, `border-${color}-500`);

            actionsContainer.innerHTML = `
                <button onclick="hideMessageBox(); ${callback ? callback.toString() + '()' : ''}" class="${buttonClass} px-8 py-3 rounded-xl font-bold transition-all duration-300 shadow-md hover:opacity-90">
                    ${buttonText}
                </button>
            `;

            msgBox.classList.remove('hidden');
        }

        function hideMessageBox() {
            document.getElementById('message-box').classList.add('hidden');
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminAccess();

            // Search input event listener
            document.getElementById('search-input').addEventListener('input', filterPlayers);

            // Gender filter event listener
            document.getElementById('gender-filter').addEventListener('change', filterPlayers);
        });
    </script>
</body>

</html>
